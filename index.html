<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>רשימון | רשימון</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600&display=swap">
<style>:root{--ground:#F7F8FA;--paper:#FFFFFF;--ink:#0D1B2A;--muted:#5E6978;--rule:#E4E8EF;--brand:#0A3463;--on-brand:#FFFFFF;--link:#1567A0}
@media (prefers-color-scheme:dark){:root{--ground:#0B1522;--paper:#111E2E;--ink:#E7ECF2;--muted:#9AA6B5;--rule:#22324A;--brand:#0A3463;--on-brand:#FFFFFF;--link:#7CC0EC}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:Rubik,"Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.7}
header{background:var(--brand);color:var(--on-brand);padding:28px 16px 24px}
header .inner,main{max-width:680px;margin:0 auto}
.app{margin:0;font-weight:600;font-size:15px;opacity:.75}
h1{margin:4px 0 0;font-size:30px;line-height:1.25;font-weight:600;text-wrap:balance}
main{padding:24px 16px 48px}
.paper{background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:28px 24px}
.updated{margin:0 0 8px;color:var(--muted);font-size:14px}
section+section{margin-top:28px}
h2{margin:0 0 6px;font-size:20px;line-height:1.35;font-weight:600;text-wrap:balance}
p{margin:0 0 10px;max-width:65ch}
a{color:var(--link);text-underline-offset:3px}
a:focus-visible{outline:2px solid var(--link);outline-offset:3px;border-radius:2px}
.contact{margin-top:32px;padding-top:20px;border-top:1px solid var(--rule);font-weight:600}
nav{margin-top:20px;display:flex;gap:20px;flex-wrap:wrap;font-size:15px}
.docs{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.docs a{display:block;padding:18px 20px;background:var(--paper);border:1px solid var(--rule);border-radius:14px;font-size:19px;font-weight:600;text-decoration:none}
@media (max-width:480px){.paper{padding:22px 18px}h1{font-size:26px}}</style>
</head>
<body>
<header><div class="inner"><p class="app">רשימון</p><h1>רשימון</h1></div></header>
<main><ul class="docs">
<li><a href="privacy.html">מדיניות הפרטיות</a></li>
<li><a href="terms.html">תנאי השימוש</a></li>
</ul></main>
</body>
</html>
